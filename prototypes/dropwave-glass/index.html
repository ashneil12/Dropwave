<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07131d" />
    <meta name="description" content="A local, fictional Dropwave project-loop prototype." />
    <title>Dropwave — project workspace</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg
      class="ambient-art"
      aria-hidden="true"
      viewBox="0 0 1600 900"
      preserveAspectRatio="xMidYMid slice"
    >
      <defs>
        <radialGradient id="ambient-warm">
          <stop stop-color="#f4bd8c" stop-opacity=".7" />
          <stop offset="1" stop-color="#f4bd8c" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="ambient-cool">
          <stop stop-color="#4ca1aa" stop-opacity=".52" />
          <stop offset="1" stop-color="#4ca1aa" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="ambient-river" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#9be6d3" stop-opacity="0" />
          <stop offset=".48" stop-color="#9be6d3" stop-opacity=".7" />
          <stop offset="1" stop-color="#f4bd8c" stop-opacity="0" />
        </linearGradient>
      </defs>
      <ellipse cx="1230" cy="150" rx="420" ry="260" fill="url(#ambient-warm)" />
      <ellipse cx="400" cy="700" rx="560" ry="330" fill="url(#ambient-cool)" />
      <g fill="none" stroke="url(#ambient-river)" stroke-width="1.2" opacity=".8">
        <path d="M-80 520C180 350 360 660 620 500S1010 350 1220 500 1470 650 1690 450" />
        <path d="M-80 548C180 378 360 688 620 528S1010 378 1220 528 1470 678 1690 478" />
        <path d="M-80 576C180 406 360 716 620 556S1010 406 1220 556 1470 706 1690 506" />
        <path d="M-80 604C180 434 360 744 620 584S1010 434 1220 584 1470 734 1690 534" />
      </g>
    </svg>
    <div id="app"></div>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
